<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Touchline Tactics</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Saira+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: tactics board — the pitch is the hero on the left, a squad/phase clipboard on the right; stacks on phones. */
:root {
  --bg: #e7ece5;
  --surface: #f7f9f5;
  --fg: #142019;
  --muted: #5a6b60;
  --line: #cdd7cc;
  --chip: #dde6db;
  --accent: #157a48;
  --accent-ink: #ffffff;
  --warn: #b42318;
  --pitch-edge: #1f5f35;
  --pitch-a: #2f8a4c;
  --pitch-b: #2a8046;
  --chalk: rgba(255, 255, 255, 0.86);
  --f-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1411; --surface: #151f1a; --fg: #e4ede6; --muted: #91a397; --line: #283830;
    --chip: #1e2b24; --accent: #4cc283; --accent-ink: #062112; --warn: #ff8a7a;
    --pitch-edge: #173f26; --pitch-a: #286f41; --pitch-b: #24673c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1411; --surface: #151f1a; --fg: #e4ede6; --muted: #91a397; --line: #283830;
  --chip: #1e2b24; --accent: #4cc283; --accent-ink: #062112; --warn: #ff8a7a;
  --pitch-edge: #173f26; --pitch-a: #286f41; --pitch-b: #24673c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font: 15px/1.4 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 20px;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-bottom: 12px; }
.brand { font: 800 26px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; display: flex; align-items: baseline; gap: 8px; }
.brand small { font: 600 11px var(--f-body); letter-spacing: .14em; color: var(--muted); }
.fixture { display: flex; align-items: center; gap: 8px; flex: 1 1 320px; min-width: 0; }
.fixture input {
  flex: 1 1 0; min-width: 0; background: transparent; border: 0; border-bottom: 2px solid var(--line);
  font: 700 22px/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .03em; padding: 2px 0;
}
.fixture input:focus { border-color: var(--accent); outline: none; }
.fixture .vs { font: 600 13px var(--f-body); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.fixture input#awayName { text-align: right; }

/* Main layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.board { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.pitch-wrap { display: flex; justify-content: center; }
#pitch {
  display: block; height: calc(100dvh - 190px); min-height: 600px; max-width: 100%; aspect-ratio: 71 / 110;
  border-radius: 10px; touch-action: none; user-select: none; -webkit-user-select: none;
}

/* Toolbar */
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; background: var(--chip); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button, .chipbtn {
  border: 0; background: transparent; padding: 6px 11px; border-radius: 6px; font-weight: 600; font-size: 14px;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.18); }
.chipbtn { background: var(--chip); }
.chipbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.sw-run { background: #ffffff; box-shadow: 0 0 0 1px var(--muted); }
.sw-pass { background: repeating-linear-gradient(90deg, #e9b500 0 4px, transparent 4px 6px); }
.sw-press { background: #ff5c5c; }
label.sel { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
label.sel select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-weight: 600; color: var(--fg); text-transform: none; letter-spacing: 0; }

/* Phase strip */
.phases { display: flex; gap: 6px; align-items: center; overflow-x: auto; padding-bottom: 2px; }
.phases .tab {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px;
  display: inline-flex; gap: 8px; align-items: baseline; white-space: nowrap; flex: none;
}
.phases .tab b { font: 700 15px var(--f-display); color: var(--muted); }
.phases .tab[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.phases .tab[aria-current="true"] b { color: var(--accent); }
.phases .act { flex: none; border: 0; border-radius: 8px; padding: 7px 12px; font-weight: 600; background: var(--chip); white-space: nowrap; }
.phases .act.primary { background: var(--accent); color: var(--accent-ink); }

/* Panel */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-width: 0; }
.panel section { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.panel section:last-child { border-bottom: 0; }
.panel h2 { margin: 0; font: 700 13px var(--f-body); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.field { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; }
textarea.field { resize: vertical; min-height: 64px; }
.phase-title { font: 700 20px var(--f-display) !important; text-transform: uppercase; letter-spacing: .02em; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 6px 10px; font-weight: 600; font-size: 14px; }
.btn.danger { color: var(--warn); }
.btn.armed { background: var(--warn); color: var(--surface); border-color: var(--warn); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.squad { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.squad li { display: grid; grid-template-columns: 52px 46px minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 2px; border-radius: 7px; }
.squad li.on { background: var(--chip); box-shadow: inset 3px 0 0 var(--accent); }
.squad .pos { border: 0; border-radius: 5px; background: var(--chip); font: 700 13px var(--f-display); letter-spacing: .04em; padding: 5px 0; }
.squad li.on .pos { background: var(--accent); color: var(--accent-ink); }
.squad input { width: 100%; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 6px 7px; font-size: 16px; }
.squad input:focus { border-color: var(--accent); outline: none; }
.editcard { display: flex; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.editcard .ec-pos { font: 700 16px var(--f-display); background: var(--chip); border-radius: 6px; padding: 7px 0; width: 52px; text-align: center; flex: none; }
.editcard.on .ec-pos { background: var(--accent); color: var(--accent-ink); }
.editcard .field { font-size: 16px; padding: 9px 10px; }
.editcard .ec-num { width: 64px; flex: none; font: 700 18px var(--f-display); text-align: center; }
.editcard .ec-name { flex: 1 1 auto; min-width: 0; }
.editcard .field:disabled { opacity: .6; }
.squad input.n { font: 700 16px var(--f-display); text-align: center; font-variant-numeric: tabular-nums; }
.squad .x { border: 0; background: transparent; color: var(--muted); font-size: 18px; padding: 0 6px; }
.bench li { grid-template-columns: 46px minmax(0, 1fr) auto; }
.subbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; background: var(--chip); border-radius: 8px; padding: 8px; font-size: 14px; }
.subbar select { flex: 1 1 120px; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.kits { display: flex; gap: 14px; flex-wrap: wrap; }
.kits label { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.kits input[type="color"] { width: 32px; height: 26px; border: 1px solid var(--line); border-radius: 6px; padding: 1px; background: var(--bg); }

/* Pitch tokens */
.edge { fill: var(--pitch-edge); }
.stripe-a { fill: var(--pitch-a); }
.stripe-b { fill: var(--pitch-b); }
.chalk { fill: none; stroke: var(--chalk); stroke-width: .22; }
.spot { fill: var(--chalk); }
.goal { fill: rgba(255,255,255,.25); stroke: var(--chalk); stroke-width: .2; }
.tok { cursor: grab; }
.tok .disc { stroke: rgba(255,255,255,.95); stroke-width: .3; }
.tok .ring { fill: none; stroke: #ffe066; stroke-width: .45; }
.num { font: 700 2.5px var(--f-display); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.nm { font: 600 1.7px var(--f-body); fill: #fff; stroke: rgba(0,0,0,.6); stroke-width: .38; paint-order: stroke; stroke-linejoin: round; text-anchor: middle; pointer-events: none; }
.opp .disc { stroke: rgba(0,0,0,.45); }
.ball .disc { fill: #fff; stroke: #111; stroke-width: .22; }
.ball .pent { fill: #111; }
.arr .ln { fill: none; stroke-width: .42; stroke-linecap: round; }
.arr.run .ln { stroke: #ffffff; }
.arr.pass .ln { stroke: #ffd23f; stroke-dasharray: 1.1 .8; }
.arr.press .ln { stroke: #ff5c5c; }
.arr .hit { stroke: transparent; stroke-width: 2.6; }
.erase .arr { cursor: pointer; }
.erase .arr:hover .ln { stroke-width: .7; }
.trail { stroke: rgba(255,255,255,.45); stroke-width: .2; stroke-dasharray: .5 .5; }
.ghost { fill: none; stroke: rgba(255,255,255,.5); stroke-width: .2; stroke-dasharray: .6 .4; }
.draw #pitch { cursor: crosshair; }

/* Sharing */
.share-btn { border: 0; border-radius: 8px; padding: 9px 16px; background: var(--accent); color: var(--accent-ink); font-weight: 600; white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
a.btn { text-decoration: none; display: inline-flex; align-items: center; }
.x { border: 0; background: transparent; color: var(--muted); font-size: 26px; line-height: 1; min-width: 44px; min-height: 44px; border-radius: 8px; }
.x:hover { background: var(--chip); }
.loaded { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: var(--chip); border-left: 4px solid var(--accent); border-radius: 8px; padding: 8px 10px; font-weight: 500; }
.loaded span { flex: 1 1 200px; }
.sheet-back {
  position: fixed; inset: 0; z-index: 10; background: rgba(8, 14, 10, .55);
  display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; width: 100%; max-width: 520px; max-height: 100%; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet h2 { margin: 0; font: 700 22px var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.sheet textarea { font: 14px/1.45 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; min-height: 220px; }
.chk { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
.chk input { margin-top: 3px; }

@media (max-width: 920px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  #pitch { height: auto; width: 100%; min-height: 0; max-width: 760px; }
}
@media (max-width: 600px) {
  .sheet-back { align-items: flex-end; padding-top: 48px; }
  .sheet { max-height: 85dvh; border-radius: 14px 14px 10px 10px; }
  .sheet textarea { min-height: 140px; }
  .sheet .row-btns .btn { flex: 1 1 140px; justify-content: center; padding: 11px 10px; }
}
@media (max-width: 480px) {
  .seg button, .chipbtn { padding: 6px 8px; font-size: 13px; }
  .brand { font-size: 22px; }
}
</style>

<header class="bar">
  <div class="brand">Touchline <small>Matchday board · 11 v 11</small></div>
  <div class="fixture">
    <input id="homeName" aria-label="Your team name" maxlength="24">
    <span class="vs">vs</span>
    <input id="awayName" aria-label="Opponent name" maxlength="24">
  </div>
  <button class="share-btn" id="shareBtn">Share lineup</button>
</header>

<main class="layout">
  <section class="board" id="board">
    <div class="loaded" id="loadedBar" hidden>
      <span id="loadedMsg">You're viewing a plan a teammate shared.</span>
      <button class="btn" id="undoLoad">Go back to my plan</button>
      <button class="x" id="loadedClose" aria-label="Dismiss">×</button>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Tool">
        <button data-tool="move" aria-pressed="true" title="Drag players and ball (V)">Move</button>
        <button data-tool="run" aria-pressed="false" title="Draw a run (R)"><span class="swatch sw-run"></span>Run</button>
        <button data-tool="pass" aria-pressed="false" title="Draw a pass (P)"><span class="swatch sw-pass"></span>Pass</button>
        <button data-tool="press" aria-pressed="false" title="Draw a press (X)"><span class="swatch sw-press"></span>Press</button>
        <button data-tool="erase" aria-pressed="false" title="Tap an arrow to remove it (E)">Erase</button>
      </div>
      <label class="sel">Formation <select id="form"></select></label>
      <button class="chipbtn" id="oppToggle" aria-pressed="false">Opponents</button>
      <label class="sel" id="oformWrap" hidden>Theirs <select id="oform"></select></label>
      <button class="chipbtn" id="trailToggle" aria-pressed="true" title="Show where players moved from in the previous phase">Trails</button>
    </div>

    <div class="editcard" id="editCard">
      <span class="ec-pos" id="ecPos">TAP</span>
      <input class="field ec-num" id="ecNum" type="number" min="1" max="99" aria-label="Shirt number" disabled>
      <input class="field ec-name" id="ecName" maxlength="18" placeholder="Tap a player, then type their name" aria-label="Player name" disabled>
      <button class="btn" id="ecNext" disabled>Next ›</button>
    </div>

    <div class="pitch-wrap">
      <svg id="pitch" viewBox="-1.5 -2.5 71 110" role="img" aria-label="Football pitch, your team attacks upward">
        <defs>
          <marker id="m-run" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffffff"/></marker>
          <marker id="m-pass" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd23f"/></marker>
          <marker id="m-press" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff5c5c"/></marker>
        </defs>
        <rect class="edge" x="-1.5" y="-2.5" width="71" height="110"/>
        <g id="stripes"></g>
        <g class="chalk">
          <rect x="0" y="0" width="68" height="105"/>
          <line x1="0" y1="52.5" x2="68" y2="52.5"/>
          <circle cx="34" cy="52.5" r="9.15"/>
          <rect x="13.84" y="0" width="40.32" height="16.5"/>
          <rect x="13.84" y="88.5" width="40.32" height="16.5"/>
          <rect x="24.84" y="0" width="18.32" height="5.5"/>
          <rect x="24.84" y="99.5" width="18.32" height="5.5"/>
          <path d="M26.69 16.5A9.15 9.15 0 0 0 41.31 16.5"/>
          <path d="M26.69 88.5A9.15 9.15 0 0 1 41.31 88.5"/>
          <path d="M1 0A1 1 0 0 1 0 1M67 0A1 1 0 0 0 68 1M0 104A1 1 0 0 1 1 105M68 104A1 1 0 0 0 67 105"/>
        </g>
        <circle class="spot" cx="34" cy="52.5" r=".35"/>
        <circle class="spot" cx="34" cy="11" r=".3"/>
        <circle class="spot" cx="34" cy="94" r=".3"/>
        <rect class="goal" x="30.34" y="-2" width="7.32" height="2"/>
        <rect class="goal" x="30.34" y="105" width="7.32" height="2"/>
        <g id="dyn"></g>
      </svg>
    </div>

    <div class="phases" id="phases"></div>
  </section>

  <aside class="panel">
    <section>
      <h2>Phase <span id="phaseCount"></span></h2>
      <input class="field phase-title" id="phName" aria-label="Phase name" maxlength="32">
      <textarea class="field" id="phNote" aria-label="Phase notes" placeholder="What should each player do in this phase?"></textarea>
      <div class="row-btns">
        <button class="btn" id="shUp" title="Move outfield players 5 m forward">Push up</button>
        <button class="btn" id="shDown" title="Move outfield players 5 m back">Drop</button>
        <button class="btn" id="shNarrow">Narrow</button>
        <button class="btn" id="shWide">Widen</button>
        <button class="btn" id="clrArrows">Clear arrows</button>
        <button class="btn danger" id="phDel">Delete phase</button>
      </div>
    </section>

    <section>
      <h2>Starting XI <span class="hint">tap a position to select</span></h2>
      <ul class="squad" id="squad"></ul>
      <div class="subbar" id="subbar" hidden></div>
    </section>

    <section>
      <h2>Bench <button class="btn" id="addSub">Add sub</button></h2>
      <ul class="squad bench" id="bench"></ul>
    </section>

    <section>
      <h2>Kits</h2>
      <div class="kits">
        <label><input type="color" id="kHome"> Outfield</label>
        <label><input type="color" id="kGk"> Keeper</label>
        <label><input type="color" id="kAway"> Opponents</label>
      </div>
      <p class="hint">Saved automatically in this browser. Keys: V move, R run, P pass, X press, E erase, Space play.</p>
      <div class="row-btns"><button class="btn danger" id="reset">Start over</button></div>
    </section>
  </aside>
</main>

<div class="sheet-back" id="shareSheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
    <div class="sheet-head">
      <h2 id="shareTitle">Share lineup</h2>
      <button class="x" id="shareClose" aria-label="Close">×</button>
    </div>
    <textarea class="field" id="shareText" rows="12" readonly aria-label="Lineup message"></textarea>
    <label class="chk"><input type="checkbox" id="shareInclLink" checked> Add a link that opens the full board: formation, phases and arrows</label>
    <div class="row-btns">
      <button class="btn primary" id="shareNative" hidden>Share…</button>
      <a class="btn" id="shareWa" href="https://web.whatsapp.com/" rel="noopener">Send on WhatsApp</a>
      <button class="btn" id="copyText">Copy message</button>
      <button class="btn" id="shareDone">Close</button>
    </div>
    <p class="hint" id="shareStatus" aria-live="polite"></p>
  </div>
</div>

<script>
(() => {
const W = 68, L = 105, KEY = 'touchline-v1';
const $ = s => document.querySelector(s);
const svg = $('#pitch'), dyn = $('#dyn');

// Formations: [position, x% across (left→right as you attack), y% up the pitch from your goal]
const BACK4 = [['LB',14,22],['LCB',37,17],['RCB',63,17],['RB',86,22]];
const BACK3 = [['LCB',28,18],['CB',50,15],['RCB',72,18]];
const GK = ['GK',50,4];
const FORMS = {
  '4-3-3':   [GK, ...BACK4, ['CM',50,32],['LCM',30,42],['RCM',70,42],['LW',14,60],['ST',50,64],['RW',86,60]],
  '4-4-2':   [GK, ...BACK4, ['LM',14,42],['LCM',38,37],['RCM',62,37],['RM',86,42],['ST',38,60],['ST',62,60]],
  '4-2-3-1': [GK, ...BACK4, ['LDM',38,32],['RDM',62,32],['LAM',16,50],['CAM',50,48],['RAM',84,50],['ST',50,63]],
  '4-1-4-1': [GK, ...BACK4, ['DM',50,30],['LM',14,46],['LCM',37,44],['RCM',63,44],['RM',86,46],['ST',50,63]],
  '4-4-1-1': [GK, ...BACK4, ['LM',14,40],['LCM',38,36],['RCM',62,36],['RM',86,40],['SS',50,52],['ST',50,63]],
  '3-5-2':   [GK, ...BACK3, ['LWB',10,42],['DM',50,30],['LCM',32,42],['RCM',68,42],['RWB',90,42],['ST',39,61],['ST',61,61]],
  '3-4-3':   [GK, ...BACK3, ['LM',12,40],['LCM',38,36],['RCM',62,36],['RM',88,40],['LW',18,59],['ST',50,63],['RW',82,59]],
  '5-3-2':   [GK, ['LWB',10,27],['LCB',30,17],['CB',50,15],['RCB',70,17],['RWB',90,27],['LCM',30,40],['CM',50,36],['RCM',70,40],['ST',39,58],['ST',61,58]],
};
const pts = (key, theirs) => FORMS[key].map(([pos, x, y]) => theirs

function ink(hex) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? '#111111' : '#ffffff';
}
function arrowSVG(a, i, alpha) {
  return `<g class="arr ${a.type}" data-arrow="${i}" opacity="${alpha}">
    <line class="hit" x1="${a.x1}" y1="${a.y1}" x2="${a.x2}" y2="${a.y2}"/>
    <line class="ln" x1="${a.x1}" y1="${a.y1}" x2="${a.x2}" y2="${a.y2}" marker-end="url(#m-${a.type})"/></g>`;
}
function render(view) {

  const v = view || { home: P.home, opp: P.opp, ball: P.ball, arrows: P.arrows, alpha: 1 };

  }
  (v.arrows || []).forEach((a, i) => { h += arrowSVG(a, i, v.alpha); });
  if (draft) h += arrowSVG(draft, -1, 1);
  if (S.showOpp) {
    const fill = S.kit.away, t = ink(fill);
    v.opp.forEach((p, i) => {
      h += `<g class="tok opp" data-k="o" data-i="${i}" transform="translate(${p.x} ${p.y})">
        <circle class="disc" r="2.1" fill="${fill}"/><text class="num" fill="${t}" font-size="2.2">${i + 1}</text></g>`;
    });

function pt(e) {

}
const objOf = (k, i) => k === 'h' ? ph().home[i] : k === 'o' ? ph().opp[i] : ph().ball;

svg.addEventListener('pointerdown', e => {
  if (anim) return;
  const p = pt(e), tok = e.target.closest('[data-k]');
  if (tool === 'erase') {
    const a = e.target.closest('[data-arrow]');
    if (a && +a.dataset.arrow >= 0) { ph().arrows.splice(+a.dataset.arrow, 1); commit(); }
    return;
  }
  if (tool === 'move') {
    if (!tok) { setSel(-1); return; }
    const k = tok.dataset.k, i = +tok.dataset.i, o = objOf(k, i);
    drag = { k, i, ox: o.x - p.x, oy: o.y - p.y, sx: p.x, sy: p.y, moved: false };
  } else {
    let s = p;
    if (tok) { const o = objOf(tok.dataset.k, +tok.dataset.i); s = { x: o.x, y: o.y }; }
    draft = { type: tool, x1: +s.x.toFixed(2), y1: +s.y.toFixed(2), x2: p.x, y2: p.y };
  }
  svg.setPointerCapture(e.pointerId);
  e.preventDefault();
  render();
});
svg.addEventListener('pointermove', e => {
  if (!drag && !draft) return;
  const p = pt(e);
  if (drag) {

    o.x = +clamp(p.x + drag.ox, -2, 70).toFixed(2);
    o.y = +clamp(p.y + drag.oy, -3, 108).toFixed(2);

  } else {

const lerpList = (A, B, k) => A.map((p, i) => ({ x: p.x + (B[i].x - p.x) * k, y: p.y + (B[i].y - p.y) * k }));
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function play() {
  if (anim) { anim = null; renderAll(); return; }
  if (S.phases.length < 2) return;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const HOLD = 900, MOVE = reduce ? 1 : 1400, n = S.phases.length;
  setSel(-1);
  anim = { t0: performance.now(), last: -1 };
  S.cur = 0; renderPhases();
  const frame = t => {
    if (!anim) return;
    const e = t - anim.t0, i = Math.floor(e / (HOLD + MOVE));
    if (i >= n - 1) { anim = null; S.cur = n - 1; renderAll(); return; }
    if (i !== anim.last) { anim.last = i; S.cur = i; renderPhases(); }
    const r = e - i * (HOLD + MOVE), A = S.phases[i], B = S.phases[i + 1];
    if (r < HOLD) render({ home: A.home, opp: A.opp, ball: A.ball, arrows: A.arrows, alpha: 1 });
    else {
      const k = ease(Math.min(1, (r - HOLD) / MOVE));
      render({ home: lerpList(A.home, B.home, k), opp: lerpList(A.opp, B.opp, k),
        ball: lerpList([A.ball], [B.ball], k)[0], arrows: A.arrows, alpha: 1 - k });
    }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

// Board links always point at the public site, so they work wherever the board was opened.
const SITE = 'https://pattson22.github.io/ModernFootballFormation/';
const b64u = bytes => { let s = ''; bytes.forEach(b => { s += String.fromCharCode(b); }); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64u = str => Uint8Array.from(atob(str.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
async function pack(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if (window.CompressionStream) {
    try {
      const z = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      return 'z' + b64u(new Uint8Array(await new Response(z).arrayBuffer()));
    } catch (e) {}
  }
  return 'j' + b64u(bytes);
}
async function unpack(str) {
  let bytes = unb64u(str.slice(1));
  if (str[0] === 'z') {
    const z = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    bytes = new Uint8Array(await new Response(z).arrayBuffer());
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}
// Rebuild a shared plan field by field so a tampered link can't inject markup.
function sanitize(d) {
  const num = v => { const n = Number(v); if (!isFinite(n)) throw new Error('bad number'); return n; };
  const pt = p => ({ x: num(p && p.x), y: num(p && p.y) });
  const str = (v, n) => String(v == null ? '' : v).slice(0, n);
  const col = (v, f) => /^#[0-9a-f]{6}$/i.test(v) ? v : f;
  if (!d || d.v !== 1 || !Array.isArray(d.players) || d.players.length !== 11 ||
      !Array.isArray(d.phases) || !d.phases.length || d.phases.length > 40) throw new Error('bad plan');
  const kit = d.kit || {};
  return {
    v: 1, homeName: str(d.homeName, 24), awayName: str(d.awayName, 24),
    kit: { home: col(kit.home, '#d62839'), gk: col(kit.gk, '#f4b400'), away: col(kit.away, '#2457c5') },
    form: FORMS[d.form] ? d.form : '4-3-3', oform: FORMS[d.oform] ? d.oform : '4-4-2',
    showOpp: !!d.showOpp, trails: d.trails !== false, cur: 0,
    players: d.players.map(p => ({ num: str(p.num, 2), name: str(p.name, 18), pos: str(p.pos, 4) })),
    bench: (Array.isArray(d.bench) ? d.bench : []).slice(0, 12).map(b => ({ num: str(b.num, 2), name: str(b.name, 18) })),
    phases: d.phases.map(p => {
      if (!Array.isArray(p.home) || p.home.length !== 11 || !Array.isArray(p.opp) || p.opp.length !== 11) throw new Error('bad phase');
      return {
        name: str(p.name, 32), note: str(p.note, 2000), home: p.home.map(pt), opp: p.opp.map(pt), ball: pt(p.ball),
        arrows: (Array.isArray(p.arrows) ? p.arrows : []).filter(a => ['run', 'pass', 'press'].includes(a.type)).slice(0, 80)
          .map(a => ({ type: a.type, x1: num(a.x1), y1: num(a.y1), x2: num(a.x2), y2: num(a.y2) })),
      };
    }),
  };
}
function slim() {
  const c = clone(S), r = v => Math.round(v * 10) / 10;
  const rp = p => { p.x = r(p.x); p.y = r(p.y); };
  c.phases.forEach(p => {
    p.home.forEach(rp); p.opp.forEach(rp); rp(p.ball);
    p.arrows.forEach(a => { a.x1 = r(a.x1); a.y1 = r(a.y1); a.x2 = r(a.x2); a.y2 = r(a.y2); });
  });
  c.cur = 0;
  return c;
}
function lineupText(link) {
  const out = [`${S.homeName || 'Our XI'} vs ${S.awayName || 'Opponents'}`, `Formation: ${S.form}`, ''];
  S.players.forEach(p => out.push(`${p.pos} - #${p.num} ${p.name || '(no name yet)'}`));
  const subs = S.bench.filter(b => b.name || b.num).map(b => `#${b.num} ${b.name || '(no name yet)'}`);
  if (subs.length) out.push('', 'Subs: ' + subs.join(', '));
  const plan = S.phases.map((p, i) => p.note && p.note.trim() ? `${i + 1}. ${p.name}: ${p.note.trim()}` : '').filter(Boolean);
  if (plan.length) out.push('', 'Game plan:', ...plan);
  if (link) out.push('', 'Full tactics board: ' + link);
  return out.join('\n');
}

let shareLink = '';
const shareStatus = t => { $('#shareStatus').textContent = t; };
function updateShareText() {
  const t = lineupText($('#shareInclLink').checked ? shareLink : '');
  $('#shareText').value = t;
  // Phones open the WhatsApp app directly; computers use WhatsApp Web in a new tab.
  const wa = $('#shareWa'), text = encodeURIComponent(t);
  if (IS_MOBILE) { wa.href = 'whatsapp://send?text=' + text; wa.removeAttribute('target'); }
  else { wa.href = 'https://web.whatsapp.com/send?text=' + text; wa.target = '_blank'; }
}
const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
async function openShare() {
  if (anim) play();
  $('#shareSheet').hidden = false;
  $('#shareNative').hidden = !navigator.share;
  shareLink = '';
  updateShareText();
  $('#shareClose').focus();
  shareStatus('Building the board link…');
  try { shareLink = SITE + '#plan=' + await pack(slim()); shareStatus(''); }
  catch (e) { shareStatus("Couldn't build a board link. You can still send the lineup text."); }
  updateShareText();
}
function closeShare() { $('#shareSheet').hidden = true; $('#shareBtn').focus(); }
$('#shareBtn').addEventListener('click', openShare);
$('#shareClose').addEventListener('click', closeShare);
$('#shareDone').addEventListener('click', closeShare);
$('#shareSheet').addEventListener('click', e => { if (e.target.id === 'shareSheet') closeShare(); });
$('#shareInclLink').addEventListener('change', updateShareText);
$('#shareNative').addEventListener('click', async () => {
  try { await navigator.share({ title: `${S.homeName} lineup`, text: $('#shareText').value }); }
  catch (e) { if (e.name !== 'AbortError') shareStatus('Sharing is blocked here. Use Copy message or WhatsApp instead.'); }
});
$('#copyText').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('#shareText').value); shareStatus('Message copied. Paste it into your team chat.'); }
  catch (e) { const t = $('#shareText'); t.focus(); t.select(); shareStatus('Text selected. Press Ctrl+C, or long-press and tap Copy.'); }
});

// Open a plan from a shared link, keeping the viewer's own plan for "Go back".
let ownPlan = null;
$('#undoLoad').addEventListener('click', () => {
  if (ownPlan) { S = ownPlan; ownPlan = null; sel = -1; renderAll(); }
  $('#loadedBar').hidden = true;
});
$('#loadedClose').addEventListener('click', () => { $('#loadedBar').hidden = true; });
(async () => {
  const m = location.hash.match(/^#plan=([zj][A-Za-z0-9_-]+)$/);
  if (!m) return;
  try {
    const shared = sanitize(await unpack(m[1]));
    ownPlan = S; S = shared; sel = -1; renderAll();
    $('#loadedMsg').textContent = "You're viewing a plan a teammate shared. Changes you make are saved as your plan.";
    $('#undoLoad').hidden = false;
  } catch (e) {
    $('#loadedMsg').textContent = "That shared link is broken or incomplete, so your own plan is still showing.";
    $('#undoLoad').hidden = true;
  }
  $('#loadedBar').hidden = false;
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
})();

function renderAll() {
  $('#homeName').value = S.homeName; $('#awayName').value = S.awayName;
  $('#kHome').value = S.kit.home; $('#kGk').value = S.kit.gk; $('#kAway').value = S.kit.away;
  formSel.value = S.form; oformSel.value = S.oform;
  syncToggles(); syncEditCard(); renderPhases(); renderSquad(); renderBench(); render(); save();
}
renderAll();
})();
</script>
